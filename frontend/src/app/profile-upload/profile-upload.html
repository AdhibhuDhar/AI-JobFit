<div class="profile-card">
  <h2>Your Profile</h2>
  <p *ngIf="currentSkills.length" class="skills-preview">
    Current skills: {{ currentSkills.join(', ') }}
  </p>
  <p *ngIf="!currentSkills.length" class="skills-preview">No resume uploaded yet — using default profile.</p>

  <input type="file" accept=".pdf,.docx" (change)="onFileSelected($event)" />
  <button (click)="upload()" [disabled]="!selectedFile || uploading">
    {{ uploading ? 'Analyzing resume...' : 'Upload & Extract Profile' }}
  </button>
</div>
